<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volume Control</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>🔊 Volume Control</h1>

        <input
            type="range"
            id="volumeSlider"
            min="0"
            max="100"
            value="50"
        >

        <p id="volumeValue">Volume: 50%</p>

        <p>Move the slider to hear the volume change.</p>
    </div>

    <script src="script.js"></script>

</body>
</html>
